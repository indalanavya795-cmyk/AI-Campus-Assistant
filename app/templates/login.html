{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="hero-icon">
            🔐
        </div>

        <h1>
            Admin Login
        </h1>

        <p>
            Manage the campus knowledge base.
        </p>

        <form method="POST">

            <input
                name="username"
                placeholder="Username"
                required
            >

            <input
                name="password"
                type="password"
                placeholder="Password"
                required
            >

            <button class="primary-button" type="submit">
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
